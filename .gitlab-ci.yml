stages:
  - quality
  - test
  - build

default:
  image: node:22

code_quality:
  stage: quality
  script:
    - npm ci
    - npm run lint
    - npm run format:check

tests:
  stage: test
  script:
    - npm ci
    - npm test -- --run

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week
