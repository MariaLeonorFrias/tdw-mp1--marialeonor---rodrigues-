
stages:
  - install
  - quality
  - test
  - build

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

install_dependencies:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

code_quality:
  stage: quality
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - npm run lint
    - npm run format:check

tests:
  stage: test
  needs:
    - job: install_dependencies
      artifacts: true
  script:
    - npm test -- --run

build:
  stage: build
  needs:
    - job: install_dependencies
      artifacts: true
    - job: code_quality
    - job: tests
  script:
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week
