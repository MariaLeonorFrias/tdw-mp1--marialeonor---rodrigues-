stages:
  - quality
  - test
  - build
  - deploy

default:
  image: node:22

code_quality:
  stage: quality
  script:
    - npm ci
    - npm run lint
    - npm run format:check

tests:
  stage: test
  script:
    - npm ci
    - npm test -- --run

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week

deploy:
  deploy:
    stage: deploy
    needs:
      - job: build
        artifacts: true
    rules:
      - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    script:
      - npm ci
      - npx wrangler deploy
